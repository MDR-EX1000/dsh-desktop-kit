name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  plugin-tarball:
    needs: shell-binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download the matching macOS shell
        uses: actions/download-artifact@v4
        with:
          name: shell-assets
          path: shell-assets

      - name: Stage native shell into the plugin package
        run: |
          mkdir -p bin
          shell_bin="$(find shell-assets -type f -name dsh-desktop-kit -print -quit)"
          launcher_bin="$(find shell-assets -type f -name dsh-launcher -print -quit)"
          test -n "$shell_bin"
          test -n "$launcher_bin"
          cp "$shell_bin" bin/dsh-desktop-kit
          cp "$launcher_bin" bin/dsh-launcher
          chmod 755 bin/dsh-desktop-kit
          chmod 755 bin/dsh-launcher

      - name: Validate and pack plugin tarball
        run: |
          pnpm build
          pnpm test
          npm pack

      - name: Add legacy tarball alias for dsh-market compatibility
        run: |
          plugin_tgz="$(find . -maxdepth 1 -type f -name 'dsh-desktop-kit-*.tgz' -print -quit)"
          test -n "$plugin_tgz"
          cp "$plugin_tgz" dsh-desktop-kit.tgz
          cp "$plugin_tgz" dsh-desktop-kit-0.1.0.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-tarball
          path: '*.tgz'

  shell-binary:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell

      - run: cargo build --release --manifest-path shell/Cargo.toml

      - name: Package shell binary (macOS aarch64)
        run: |
          tag="${GITHUB_REF_NAME}"
          mkdir -p out
          clang -O2 -Wall -Wextra -mmacosx-version-min=13.0 \
            app/dsh-launcher.c -o out/dsh-launcher
          chmod 755 out/dsh-launcher
          install -m 755 shell/target/release/dsh-desktop-kit out/dsh-desktop-kit
          tar -czf "out/dsh-desktop-kit-${tag}-macos-aarch64.tar.gz" \
            -C shell/target/release dsh-desktop-kit

      - uses: actions/upload-artifact@v4
        with:
          name: shell-assets
          path: out/*
          include-hidden-files: true

  release:
    needs: [plugin-tarball, shell-binary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tgz, artifacts/**/*.tar.gz
          generateReleaseNotes: true
