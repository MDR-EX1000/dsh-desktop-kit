[package]
name = "dsh-desktop-kit"
version = "0.1.0"
edition = "2021"
description = "Native desktop shell for DeepSeek Harness: a decorated Tauri window on the loopback web surface"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"

[profile.release]
strip = true
lto = true
